version: "1.0.0"
agent_id: "hermes-agent"
agent_name: "Hermes Code Assistant"
persona: "Hermes Prime"
system_preset: "engineer"
system_prompt: ""

model:
  provider: custom
  apiKey: ollama
  temperature: 0.3
  reasoningEffort: high
  maxTokens: 8192
  contextWindow: 200000
  baseUrl: http://192.168.1.49:11434
  topP: 0.95
  default: gemma4-soul:latest
  base_url: http://192.168.1.49:11434/v1

web:
  backend: exa
  provider_tier:
    exa: free

fallback:
  enabled: true
  strategy: "on_offline"
  target_agent_id: "zeroclaw"
  latency_threshold_ms: 3000
  provider: "openrouter"
  model: "anthropic/claude-3.7-sonnet"
  api_key: ""
  base_url: "https://openrouter.ai/api/v1"
  use_proxy: true

channels:
  telegram:
    enabled: true
    bot_token: "env:TELEGRAM_BOT_TOKEN"
    allowed_users: ["@developer", "@admin"]
    mode: "polling"
  discord:
    enabled: false
  webhook:
    enabled: true
    port: 8080
    auth_token: "hermes_secret_token_99"

security:
  sandbox_mode: "docker_isolated"
  allowed_directories:
    - "/workspace"
    - "/tmp/agent-scratch"
    - "/var/log/hermes"
  max_execution_time_sec: 120
  block_network_access: false
  require_approval_for_commands: false

storage:
  memory_backend: "everos"
  db_path: "/data/everos/memories"
  auto_summarize_interval: 25
  max_history_turns: 100
  vector_db_url: "http://everos:8080"

moa:
  enabled: true
  presets:
    default:
      reference_models:
        - provider: gemma4-soul
          model: latest
          enabled: true
        - provider: deepseek-coder-v2
          model: 16b
          enabled: true
        - provider: qwen2-5-coder-7b-32k
          model: latest
          enabled: true
      aggregator:
        provider: gemma4-soul
        model: latest
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
        - provider: gemma4-soul
          model: latest
          enabled: true
        - provider: deepseek-coder-v2
          model: 16b
          enabled: true
        - provider: qwen2-5-coder-7b-32k
          model: latest
          enabled: true
  aggregator:
    provider: gemma4-soul
    model: latest
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  rounds: 2
  temperature_spread: 0.3
  consensus_threshold: 0.85

env:

