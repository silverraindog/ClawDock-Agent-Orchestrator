name: Docker Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.DEPLOYMENT_KEY || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ secrets.GH_PAT || secrets.DEPLOYMENT_KEY }}" ]; then
            echo "Using elevated token for bypass authentication."
          fi

      - name: Increment Version and Sync Dockerfile
        id: versioning
        run: |
          # Ensure all remote tags are fetched
          git fetch --tags --force
          
          # Initial patch bump
          npm version patch --no-git-tag-version
          
          # Increment patch version until we find a version tag that does not exist locally or on remote
          while git rev-parse "v$(node -p "require('./package.json').version")" >/dev/null 2>&1 || \
                git ls-remote --tags origin "refs/tags/v$(node -p "require('./package.json').version")" | grep -q "refs/tags/"; do
            echo "Tag v$(node -p "require('./package.json').version") already exists, incrementing patch version..."
            npm version patch --no-git-tag-version
          done
          
          # Extract the unique new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Target unique version determined: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          # Sync the Dockerfile version label
          sed -i "s/LABEL version=\".*\"/LABEL version=\"$NEW_VERSION\"/" Dockerfile
          
          git add package.json package-lock.json Dockerfile
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          
          # If GH_PAT or DEPLOYMENT_KEY is provided, push directly to main (bypassing PR rule)
          if [ -n "${{ secrets.GH_PAT || secrets.DEPLOYMENT_KEY }}" ]; then
            echo "Pushing directly to main using elevated PAT/Deploy Key..."
            git push origin main --tags
          else
            echo "Pushing via release branch and PR workflow..."
            RELEASE_BRANCH="release/v$NEW_VERSION"
            git checkout -b $RELEASE_BRANCH
            git push origin $RELEASE_BRANCH --tags
            gh pr create --title "chore: release v$NEW_VERSION [skip ci]" --body "Automated version bump and Docker release preparation for v$NEW_VERSION." --base main --head $RELEASE_BRANCH
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.DEPLOYMENT_KEY || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.NEW_VERSION }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
