name: Auto Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'AI Studio automated sync update'
          title: 'AI Studio: Automated Changes Sync'
          body: |
            Automated Pull Request generated by GitHub Actions when code changes are pushed from Google AI Studio.
            - Reviews tests, linting, and builds automatically.
          branch: ai-studio-sync
          base: main
          delete-branch: true
          signoff: false
