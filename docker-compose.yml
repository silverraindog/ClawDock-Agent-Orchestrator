  hermes:
    profiles: [bots]
    image: docker.io/nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    restart: unless-stopped
    env_file:
      - path: .env.hermes
        format: raw
    volumes:
      - /home/sargus/.hermes-data:/opt/data
      - /home/sargus/.hermes:/opt/data/.hermes
      - /home/sargus/.ssh:/opt/data/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "0.0.0.0:8000:8642"
      - "0.0.0.0:9119:9119"
      - "0.0.0.0:8642:8642"
    networks: [claw-network]

  zeroclaw:
    profiles: [bots]
    build:
      context: .
      dockerfile: docker/zeroclaw.Dockerfile
    container_name: zeroclaw
    command: [daemon]
    restart: unless-stopped
    env_file:
      - path: .env.zeroclaw
        format: raw
    volumes:
      - /home/zeroclaw:/home/zeroclaw
      - /opt/bots/zeroclaw/.env-mcp:/tmp/everos-mcp/.env-mcp:ro
    networks: [claw-network]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  openclaw:
    profiles: [bots]
    build:
      context: .
      dockerfile: docker/openclaw.Dockerfile
    container_name: openclaw-gateway
    user: "1002:1002"
    restart: unless-stopped
    env_file:
      - path: .env.openclaw
        format: raw
    ports:
      - "18791:18789"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /home/openclaw:/home/openclaw
      - /opt/bots/openclaw/.env-mcp:/tmp/everos-mcp/.env:ro
    networks: [claw-network]

  picoclaw-launcher:
    profiles: [bots]
    image: docker.io/sipeed/picoclaw:launcher
    container_name: picoclaw-launcher
    restart: always
    env_file:
      - path: .env.picoclaw
        format: raw
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - /home/picoclaw:/root/.picoclaw

# #------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  claw-network:
    name: claw-network
    driver: bridge

# ------------------------------------------------------------------------------
# Named Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  claw-configs:
    driver: local
  claw-workspace:
    driver: local
