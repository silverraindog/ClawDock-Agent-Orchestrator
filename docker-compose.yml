# ==============================================================================
# ClawDock Agent Orchestrator - Full Docker Compose Stack
# (Docker Compose Specification v2 - obsolete 'version' key omitted)
# Includes:
#   1. ClawDock Python Web UI & Orchestrator (Port 3000)
#   2. Hermes Agent (Nous Research Python Runtime, Port 8080)
#   3. ZeroClaw (Rust Tokio Micro-Daemon, Port 8081)
#   4. OpenClaw (TypeScript/Node.js Gateway Hub, Port 8082)
#   5. PicoClaw (Sipeed Ultra-low RAM Go Engine, Port 8083)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # ClawDock Python Web Orchestrator
  # ----------------------------------------------------------------------------
  clawdock-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawdock-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount host Docker socket for real-time container detection & lifecycle control
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist configuration schema files and custom SKILL.md specs
      - ./data/configs:/data/configs
      # Persist SQLite database and agent state files
      - ./data/sqlite:/data/sqlite
      # Shared workspace for agents to read/write files and execute code
      - ./workspace:/workspace
    environment:
      - PORT=3000
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONFIG_STORE_DIR=/data/configs
    networks:
      - claw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

